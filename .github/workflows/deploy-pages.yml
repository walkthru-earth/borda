name: Deploy frontend (GitHub Pages)

# Rebuilds the SvelteKit SPA with the latest Parquet data after every data commit.
# Enable Pages (Settings → Pages → Source: GitHub Actions) for this to publish.
on:
  push:
    branches: [main]
    paths: ["data/**", "frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json # version from packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          # project pages live under /<repo>/
          BASE_PATH: /${{ github.event.repository.name }}
          # PostHog product analytics (browser SDK). The project key is public by design but is
          # kept as a repository secret so it never appears in logs. Missing → analytics is a no-op.
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST || 'https://eu.i.posthog.com' }}
        run: pnpm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
