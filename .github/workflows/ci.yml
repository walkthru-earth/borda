name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "diagnostics/**"]
  pull_request:
    paths-ignore: ["data/**", "diagnostics/**"]

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run borda --help
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json # version from packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check
      - name: Build
        env:
          BASE_PATH: /borda
          SITE_URL: https://walkthru.earth/borda
          VITE_SITE_ORIGIN: https://walkthru.earth
        run: pnpm run build
