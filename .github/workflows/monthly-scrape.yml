name: Monthly Borda catalog scrape

on:
  schedule:
    - cron: "17 3 1 * *" # 03:17 UTC on the 1st of every month (off the :00 rush)
  workflow_dispatch:
    inputs:
      stores:
        description: "Space-separated store slugs (empty = all enabled)"
        required: false
        default: ""
      max_pages:
        description: "Cap listing pages per store (empty = full)"
        required: false
        default: ""
      ai:
        description: "Run Pydantic AI enrichment"
        type: boolean
        default: true
      fresh:
        description: "Ignore checkpoints from an earlier attempt this month"
        type: boolean
        default: false

concurrency:
  group: borda-scrape
  cancel-in-progress: false # never abort a half-finished monthly run

permissions:
  contents: write

env:
  UV_LOCKED: "1"
  BORDA_PROFILE: egypt # this workflow maintains the default published Egypt snapshot
  BORDA_REQUEST_DELAY_S: "0.6"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # setup-uv stopped publishing floating major tags in v8 – pin the full version.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true # caches ~/.cache/uv keyed on uv.lock
          python-version: "3.12"

      - name: Install
        run: uv sync --all-groups

      - name: Unit tests
        run: uv run pytest -q

      # .cache/ holds three resumable things, none of them committed:
      #   .cache/checkpoints/egypt/<fingerprint>/<YYYY-MM>/ per-store offers + enrichment mirror
      #                                  or "Re-run failed jobs" continues where it stopped
      #   .cache/http/                   fetched pages (TTL) -> retried stores are fast
      #   .cache/hf/                     the MiniLM ONNX model (23 MB)
      # Saved with `if: always()` below so a failed / timed-out attempt still keeps its progress.
      - name: Restore checkpoints, page cache, embedding model
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: scrape-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scrape-cache-

      - name: Checkpoint status
        run: |
          uv run python - <<'PY'
          from datetime import datetime, timezone
          from borda.checkpoint import Checkpoint
          from borda.config import settings

          month = datetime.now(timezone.utc).strftime("%Y-%m")
          profile = settings.country_profile
          effective_profile = profile.model_copy(update={"stores": profile.configured_stores()})
          checkpoint = Checkpoint(settings.cache.parent / "checkpoints", month, profile=effective_profile)
          summary = checkpoint.summary()
          if summary["stores"]:
              print(f"::notice::Resuming month {month} – {summary['stores']} checkpointed stores at {checkpoint.dir}")
          else:
              print(f"No checkpoint for {month} and this profile configuration – fresh run")
          PY

      - name: Scrape, normalise, enrich, persist
        id: run
        env:
          HETZNER_INFERENCE_TOKEN: ${{ secrets.HETZNER_INFERENCE_TOKEN }}
          BORDA_PROXY_URL: ${{ secrets.BORDA_PROXY_URL }} # optional: stores that block DC IPs
          HF_HUB_CACHE: ${{ github.workspace }}/.cache/hf
          BORDA_AI_ENABLED: ${{ inputs.ai == false && 'false' || 'true' }}
        run: |
          set -o pipefail
          args=()
          [ -n "${{ inputs.stores }}" ] && args+=(--stores ${{ inputs.stores }})
          [ -n "${{ inputs.max_pages }}" ] && args+=(--max-pages "${{ inputs.max_pages }}")
          [ "${{ inputs.fresh }}" = "true" ] && args+=(--fresh)
          # one stream: phase groups, progress and ::annotations:: in order; copy kept as run.log
          uv run borda run "${args[@]}" --out diagnostics/run-summary.json 2>&1 | tee diagnostics/run.log
          echo "run_id=$(python3 -c 'import json;print(json.load(open("diagnostics/run-summary.json"))["run_id"])')" >> "$GITHUB_OUTPUT"

      - name: Save checkpoints, page cache, embedding model
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: scrape-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Borda scrape ${{ steps.run.outputs.run_id }}"
            echo
            if [ ! -f diagnostics/latest.json ]; then echo "run did not produce diagnostics – see run.log artifact"; exit 0; fi
            echo '| store | status | offers | pages | error |'
            echo '|---|---|---:|---:|---|'
            python3 - <<'PY'
          import json
          d = json.load(open("diagnostics/latest.json"))
          for s in d["stores"]:
              err = (s.get("error") or "").replace("|", "\\|")[:120]
              print(f"| {s['seller']} | {s['status']} | {s['offers']} | {s['pages']} | {err} |")
          print()
          print(f"**offers** {d['offers_kept']} · **products** {d['products_total']} (+{d['products_new']}) · **flags** {d['flags']} · **duration** {d['duration_s']/60:.1f} min")
          if d.get("resumed_stores"):
              print(f"\n♻️ resumed from checkpoint: {', '.join(d['resumed_stores'])}")
          if d.get("embeddings"):
              e = d["embeddings"]; print(f"\n**embeddings** computed={e['computed']} reused={e['reused']} neighbours={e['neighbours']}")
          if d.get("enrichment"):
              e = d["enrichment"]
              print(f"\n**enrichment** requested={e['requested']} enriched={e['enriched']} cached={e['cached']} stale={e.get('stale', 0)} "
                    f"merged={e['merged']} batches={e['batches']} failed_batches={e['failed_batches']} deferred={e.get('deferred', 0)}")
              if e.get("deferred"):
                  print(f"\n> ⏳ time budget reached – {e['deferred']} products will be enriched by the next run")
              if e.get("error"):
                  print(f"\n> ❌ last enrichment error: {e['error'][:300]}")
          for err in d.get("errors", []):
              print(f"\n> ⚠️ {err}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs & diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 90

      - name: Commit data + diagnostics
        if: success()
        run: |
          git config user.name "borda-bot"
          git config user.email "borda-bot@users.noreply.github.com"
          rm -f diagnostics/run.log diagnostics/run-summary.json   # kept as artifact, not in git
          git add data diagnostics
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          products=$(python3 -c 'import json;print(json.load(open("data/manifest.json"))["products"])')
          git commit -m "data: run ${{ steps.run.outputs.run_id }} (${products} products)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Fail the job if a store broke or enrichment produced nothing
        if: success()
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("diagnostics/latest.json"))
          failed = [s["seller"] for s in d["stores"] if s["status"] == "failed"]
          print("failed stores:", failed or "none")
          e = d.get("enrichment") or {}
          # The run is best-effort per batch, but a whole run with an error and zero enriched
          # products means the model/endpoint contract broke (e.g. HTTP 400 on every batch in
          # Sept 2026) – that must not stay green month after month.
          enrichment_dead = bool(e) and e.get("requested", 0) > 0 and e.get("enriched", 0) == 0 and e.get("error")
          print("enrichment:", "BROKEN – " + str(e.get("error"))[:200] if enrichment_dead else "ok")
          # Data is already committed; a non-zero exit here only turns the run red so
          # someone looks at it. Remove `sys.exit` for a quieter setup.
          sys.exit(1 if failed or enrichment_dead else 0)
          PY
