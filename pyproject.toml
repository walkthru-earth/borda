[project]
name = "borda"
version = "0.1.0"
description = "Electronic component search and price-history tracking across configurable country catalogs, starting with Egypt"
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-4.0"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.10",
    "pydantic-ai-slim[openai,anthropic,google]>=2.45",
    "httpx[http2]>=0.28",
    "selectolax>=0.4",
    "rapidfuzz>=3.14",
    "pyarrow>=25.0.1",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "huggingface-hub>=0.30",
    "numpy>=2",
]

[project.scripts]
borda = "borda.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.3", "respx>=0.22", "ruff>=0.16"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "borda"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]  # formatter owns line length; the canonical-rules table is intentionally wide

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:borda"]
